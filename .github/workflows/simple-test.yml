name: Examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  OHRS_VERSION: "1.5.0"

jobs:
  examples:
    name: Build examples (OHOS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "5.0.0"
          components: native

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples

      - name: Cache ohrs
        id: cache-ohrs
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/ohrs
          key: ohrs-${{ runner.os }}-${{ runner.arch }}-${{ env.OHRS_VERSION }}

      - name: Install ohrs
        if: steps.cache-ohrs.outputs.cache-hit != 'true'
        run: cargo install ohrs --version $OHRS_VERSION --locked

      - name: Build hello example
        working-directory: examples/hello
        run: ohrs build

      - name: Build FFRT example
        working-directory: examples/simple-ffrt
        run: ohrs build
