name: OHOS QEMU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"

jobs:
  native-tests:
    name: Native binaries (x86_64 OHOS / KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 unzip libusb-1.0-0
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Test runner failure detection
        run: python3 -m unittest discover -s scripts/qemu -p 'test_*.py'

      - name: Setup OpenHarmony 7.0 SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        id: sdk
        with:
          version: "7.0"
          components: "native;toolchains"
          mirror: true

      - name: Require API 26 SDK
        env:
          SDK_API: ${{ steps.sdk.outputs.api-version }}
        run: test "$SDK_API" = '26'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-ohos

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ohos-qemu-x86_64
          cache-targets: false

      - name: Download and boot verified OHOS QEMU
        run: |
          python3 scripts/qemu/boot.py \
            --output target/qemu/guest --arch x86_64 --accel kvm \
            --hdc "${OHOS_BASE_SDK_HOME}/toolchains/hdc"

      - name: Execute Rust binaries in QEMU three times
        run: |
          python3 scripts/qemu/run.py \
            --guest target/qemu/guest/guest.json --ndk "${OHOS_NDK_HOME}" \
            --output target/qemu/results --repeat 3

      - name: Stop QEMU and HDC
        if: always()
        run: python3 scripts/qemu/stop.py --guest target/qemu/guest/guest.json

      - name: Upload test and guest logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohos-qemu-native-evidence
          if-no-files-found: warn
          path: |
            target/qemu/results/
            target/qemu/guest/guest.json
            target/qemu/guest/*.log
